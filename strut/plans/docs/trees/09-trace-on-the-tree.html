<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent trace: a run reading the tree</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/system-canvas-standalone@latest/dist/system-canvas.min.js"></script>
    <script>
      // The knowledge tree on the right; a run's steps and tool calls on the left, each pointing at the node it read. Reflection writes back. 16 nodes.

      const HUE = {
        repository: '#f59e0b', concept: '#34d399', file: '#38bdf8', function: '#a78bfa',
        class: '#e879f9', endpoint: '#22d3ee', datamodel: '#fb7185',
        pr: '#94a3b8', commit: '#94a3b8', clue: '#fde68a', proposal: '#fdba74',
        chat: '#f472b6', run: '#fb923c', session: '#fbbf24', toolcall: '#cbd5e1', workflow: '#a3e635',
        note: '#64748b',
      };
      const FRESH = { fresh: '#2fa57c', aging: '#fbbf24', stale: '#475569' };
      const cd = (c) => c.node.customData || {};
      const tint = (hex, a) => { const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };
      const statusColor = (c) => FRESH[cd(c).freshness === 'growing' ? 'fresh' : (cd(c).freshness || 'aging')];
      const LABEL = { fresh: 'FRESH', aging: 'AGING', stale: 'STALE', growing: 'GROWING' };
      const cat = (key, label, w, h, extra = {}) => {
        const { slots = {}, ...rest } = extra;
        return { defaultWidth: w, defaultHeight: h, cornerRadius: 10, fill: tint(HUE[key], 0.15), stroke: HUE[key],
          slots: { header: { kind: 'text', value: label }, ...slots }, ...rest };
      };
      const categories = {
        repository: cat('repository', ':Repository', 240, 96, { cornerRadius: 14, slots: {
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        concept: cat('concept', ':Concept', 200, 84, { slots: {
          topRight: { kind: 'pill', value: (c) => LABEL[cd(c).freshness] || '', color: statusColor },
          topRightOuter: { kind: 'count', value: (c) => cd(c).clues, hideWhenEmpty: true },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        file: cat('file', ':File', 250, 72, { slots: {
          topRight: { kind: 'pill', value: (c) => cd(c).inDocs === undefined ? '' : (cd(c).inDocs ? 'IN DOCS' : 'OFF DOCS'), color: (c) => cd(c).inDocs ? HUE.concept : HUE.note },
          bottomEdge: { kind: 'progress', value: (c) => cd(c).importance || 0, color: statusColor, hideWhenZero: true } } }),
        function: cat('function', ':Function', 180, 64, { slots: { topRightOuter: { kind: 'count', value: (c) => cd(c).callers, hideWhenEmpty: true } } }),
        class: cat('class', ':Class', 180, 64),
        endpoint: cat('endpoint', ':Endpoint', 200, 64),
        datamodel: cat('datamodel', ':Datamodel', 180, 64, { cornerRadius: 32 }),
        pr: cat('pr', ':PullRequest', 230, 76, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).when || '', color: statusColor } } }),
        commit: cat('commit', ':Commit', 230, 76, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).when || '', color: statusColor } } }),
        clue: cat('clue', ':Clue', 200, 72),
        proposal: cat('proposal', ':ConceptProposal', 200, 72, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).status || '', color: HUE.proposal } } }),
        chat: cat('chat', ':StrutChat', 200, 72),
        run: cat('run', ':StrutRun', 200, 84, { slots: {
          topRight: { kind: 'pill', value: (c) => cd(c).status || '', color: (c) => cd(c).status === 'OK' ? FRESH.fresh : HUE.run },
          footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        session: cat('session', ':StrutAgentSession', 210, 84, { slots: { footer: { kind: 'text', value: (c) => cd(c).footer || '' } } }),
        toolcall: cat('toolcall', ':StrutToolCall', 190, 64, { slots: { topRightOuter: { kind: 'count', value: (c) => cd(c).n, hideWhenEmpty: true } } }),
        workflow: cat('workflow', ':StrutWorkflow', 200, 72, { slots: { topRight: { kind: 'pill', value: (c) => cd(c).version || '', color: HUE.workflow } } }),
        note: { defaultWidth: 260, defaultHeight: 56, cornerRadius: 8, fill: 'rgba(15,23,42,0.55)', stroke: HUE.note },
      };
      const N = (id, category, text, x, y, customData, extra = {}) => ({ id, type: 'text', text, x, y, category, customData, ...extra });
      const E = (from, to, label, opts = {}) => ({ id: `${from}->${to}:${label || ''}`, fromNode: from, toNode: to, label, ...opts });
      const theme = { ...SystemCanvas.themes.midnight, categories: { ...SystemCanvas.themes.midnight.categories, ...categories } };

      const canvas = {
        theme: { base: 'midnight' },
        nodes: [
          N("repo", "repository", "stakwork/hive", 300, -440, {"footer": "5 concepts · 1 run today"}),
          N("ws", "concept", "Workspaces", 60, -260, {"freshness": "fresh", "clues": 24, "footer": "touched just now"}),
          N("runner", "concept", "Task Runner", 560, -260, {"freshness": "fresh", "clues": 17, "footer": "touched 5h ago"}),
          N("f1", "file", "src/services/workspace.ts", -80, -100, {"inDocs": true, "importance": 0.92, "freshness": "fresh"}),
          N("f2", "file", "src/app/api/workspaces/\nroute.ts", 210, -100, {"inDocs": true, "importance": 0.81, "freshness": "fresh"}, {"height": 88}),
          N("pool", "file", "src/lib/runner/pool.ts", 560, -100, {"inDocs": true, "importance": 0.87, "freshness": "fresh"}),
          N("fn", "function", "createWorkspace()", -80, 60, {"callers": 6}),
          N("ep", "endpoint", "POST /api/workspaces", 210, 60, {}),
          N("spawn", "function", "RunnerPool.spawn()", 560, 60, {"callers": 4}),
          N("run", "run", "run r-2291", -1260, -100, {"status": "OK", "footer": "workspace-triage v3 · 0.86"}),
          N("s1", "session", "step 1 · read", -940, -260, {"footer": "3 tool calls"}),
          N("s2", "session", "step 2 · patch", -940, -100, {"footer": "2 tool calls"}),
          N("s3", "session", "step 3 · reflect", -940, 60, {"footer": "1 tool call"}),
          N("t1", "toolcall", "search_concepts", -620, -260, {}),
          N("t3", "toolcall", "read_file", -620, -100, {}),
          N("t5", "toolcall", "save_clue", -620, 60, {}),
        ],
        edges: [
          E("repo", "ws", "0.95", {"color": "#2fa57c", "strokeWidth": 7.7, "fromSide": "bottom", "toSide": "top"}),
          E("repo", "runner", "0.88", {"color": "#2fa57c", "strokeWidth": 7.2, "fromSide": "bottom", "toSide": "top"}),
          E("ws", "f1", "MODIFIES 0.92", {"color": "#2fa57c", "strokeWidth": 7.5, "fromSide": "bottom", "toSide": "top"}),
          E("ws", "f2", "MODIFIES 0.81", {"color": "#2fa57c", "strokeWidth": 6.8, "fromSide": "bottom", "toSide": "top"}),
          E("runner", "pool", "MODIFIES 0.87", {"color": "#2fa57c", "strokeWidth": 7.2, "fromSide": "bottom", "toSide": "top"}),
          E("f1", "fn", "CONTAINS", {"color": "#a78bfa", "strokeWidth": 2.5, "fromSide": "bottom", "toSide": "top"}),
          E("f2", "ep", "CONTAINS", {"color": "#22d3ee", "strokeWidth": 2.5, "fromSide": "bottom", "toSide": "top"}),
          E("pool", "spawn", "CONTAINS", {"color": "#a78bfa", "strokeWidth": 2.5, "fromSide": "bottom", "toSide": "top"}),
          E("s1", "run", "IN_RUN", {"color": "#fbbf24", "strokeWidth": 2, "fromSide": "left", "toSide": "right"}),
          E("s2", "run", "IN_RUN", {"color": "#fbbf24", "strokeWidth": 2, "fromSide": "left", "toSide": "right"}),
          E("s3", "run", "IN_RUN", {"color": "#fbbf24", "strokeWidth": 2, "fromSide": "left", "toSide": "right"}),
          E("t1", "s1", "IN_SESSION", {"color": "#cbd5e1", "strokeWidth": 1.5, "fromSide": "left", "toSide": "right"}),
          E("t3", "s2", "IN_SESSION", {"color": "#cbd5e1", "strokeWidth": 1.5, "fromSide": "left", "toSide": "right"}),
          E("t5", "s3", "IN_SESSION", {"color": "#cbd5e1", "strokeWidth": 1.5, "fromSide": "left", "toSide": "right"}),
          E("t1", "ws", "ACCESSED", {"color": "#fb923c", "strokeWidth": 2.5, "fromSide": "right", "toSide": "left"}),
          E("t3", "f1", "ACCESSED", {"color": "#fb923c", "strokeWidth": 2.5, "fromSide": "right", "toSide": "left"}),
          E("t3", "fn", "ACCESSED", {"color": "#fb923c", "strokeWidth": 2, "fromSide": "right", "toSide": "left"}),
          E("t5", "ws", "WROTE clue", {"color": "#fde68a", "strokeWidth": 2.5, "fromSide": "right", "toSide": "left"}),
        ],
      };
      SystemCanvas.render(document.getElementById('app'), { canvas, theme, edgeStyle: 'bezier', rootLabel: "Agent trace: a run reading the tree" });
    </script>
  </body>
</html>
