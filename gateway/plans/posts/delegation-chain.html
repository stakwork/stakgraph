<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Agent Mothership — delegation chain</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0a; }
      #app { width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/system-canvas-standalone@latest/dist/system-canvas.min.js"></script>
    <script>
      // Option A — "the chain".
      //
      // Two columns. Left: who holds a key. Right: the signed layer that
      // key produces. Reading top to bottom is reading the macaroon from
      // its root to its leaf. Zoom in on any layer to see its wire fields;
      // click the Mothership's corner tab to open its internals.

      const field = (i) => ({
        label: (ctx) => ctx.node.customData?.rows?.[i]?.[0] ?? null,
        value: (ctx) => ctx.node.customData?.rows?.[i]?.[1] ?? null,
        mono: true,
      });

      const fieldReveal = {
        below: {
          kind: 'list',
          threshold: 1.3,
          fadeWindow: 0.4,
          offset: 12,
          width: 320,
          align: 'start',
          alignValues: true,
          valueWeight: 400,
          labelWeight: 400,
          rows: [0, 1, 2, 3, 4, 5, 6, 7].map(field),
        },
      };

      const kicker = (fallback) => ({
        kind: 'text',
        value: (ctx) => ctx.node.customData?.kicker ?? fallback,
      });

      const categories = {
        principal: {
          defaultWidth: 270, defaultHeight: 84,
          fill: 'rgba(76,29,149,0.35)', stroke: '#a78bfa',
          slots: { leftEdge: { kind: 'color', extent: 'full' }, header: kicker('PRINCIPAL') },
        },
        agent: {
          defaultWidth: 270, defaultHeight: 84,
          fill: 'rgba(8,51,68,0.45)', stroke: '#22d3ee',
          slots: { leftEdge: { kind: 'color', extent: 'full' }, header: kicker('AGENT') },
        },
        layer: {
          defaultWidth: 320, defaultHeight: 84,
          fill: 'rgba(6,78,59,0.35)', stroke: '#34d399',
          slots: { header: kicker('SIGNED LAYER') },
          reveals: fieldReveal,
        },
        gateway: {
          defaultWidth: 290, defaultHeight: 96,
          fill: 'rgba(124,45,18,0.35)', stroke: '#fb923c',
          slots: { topEdge: { kind: 'color', extent: 'full' }, header: kicker('AGENT MOTHERSHIP') },
        },
        external: {
          defaultWidth: 340, defaultHeight: 84,
          fill: 'rgba(30,41,59,0.45)', stroke: '#94a3b8',
          slots: { header: kicker('') },
        },
        component: { defaultWidth: 260, defaultHeight: 76, fill: 'rgba(124,45,18,0.25)', stroke: '#fb923c' },
        store:     { defaultWidth: 260, defaultHeight: 76, fill: 'rgba(76,29,149,0.30)', stroke: '#a78bfa' },
      };

      const theme = { base: 'midnight', categories };

      const canvas = {
        theme,
        nodes: [
          // ── who signs ────────────────────────────────────────────────
          { id: 'org', type: 'text', category: 'principal', x: -360, y: 0,
            text: 'Organization\nm-of-n multisig · secp256k1',
            customData: { kicker: 'ORG' } },
          { id: 'human', type: 'text', category: 'principal', x: -360, y: 180,
            text: 'Human\nEd25519 · child of their xpub',
            customData: { kicker: 'HUMAN' } },
          { id: 'agent', type: 'text', category: 'agent', x: -360, y: 360,
            text: 'Agent process\nproxy key + macaroon',
            customData: { kicker: 'AGENT' } },
          { id: 'subagent', type: 'text', category: 'agent', x: -360, y: 540,
            text: 'Sub-agent\nnarrower macaroon',
            customData: { kicker: 'SUB-AGENT' } },
          { id: 'mothership', type: 'text', category: 'gateway', x: -380, y: 730, ref: 'mothership',
            text: 'Agent Mothership',
            customData: { kicker: 'VERIFY · ENFORCE · SWAP KEY · LOG' } },

          // ── what they sign ───────────────────────────────────────────
          { id: 'ua', type: 'text', category: 'layer', x: 120, y: 0,
            text: 'user_authorization\norg_sig · secp256k1 or multisig-v1',
            customData: { kicker: 'LAYER 1 · SIGNED BY THE ORG', rows: [
              ['user_id', 'alice'],
              ['user_pubkey', 'ed25519 · 8b2f…c41a'],
              ['agents', '[coder, browser, repair]'],
              ['budget', 'max_total 1000 · per_invocation 25'],
              ['exp', '2026-10-01T00:00:00Z'],
              ['nonce', '9f4e…'],
              ['org_sig', 'multisig-v1 · 2 of 3 keys'],
            ] } },
          { id: 'inv', type: 'text', category: 'layer', x: 120, y: 180,
            text: 'invocation\nuser_sig · Ed25519 over JCS',
            customData: { kicker: 'LAYER 2 · SIGNED BY THE HUMAN', rows: [
              ['agents', '[coder]  ⊆ user_authorization.agents'],
              ['run_id', 'r_01J9…'],
              ['max_cost_usd', '5.00'],
              ['max_steps', '100'],
              ['exp', 'iat + 10m'],
              ['nonce', '7c2a…'],
              ['user_sig', 'ed25519 · a3b1…'],
            ] } },
          { id: 'att1', type: 'text', category: 'layer', x: 120, y: 360,
            text: 'attenuations[0]\nHMAC-SHA256(user_sig, JCS(caveats))',
            customData: { kicker: 'LAYER 3 · CHAINED BY THE AGENT', rows: [
              ['agents', '[coder, web-search]  ⊇ parent'],
              ['max_cost_usd', '2.00  ≤ parent'],
              ['max_steps', '40  ≤ parent'],
              ['exp', 'iat + 2m  ≤ parent'],
              ['run_id', 'r_child…'],
              ['hmac', '5f3c…'],
            ] } },
          { id: 'att2', type: 'text', category: 'layer', x: 120, y: 540,
            text: 'attenuations[1]\nHMAC-SHA256(prev hmac, JCS(caveats))',
            customData: { kicker: 'LAYER 4 · CHAINED BY THE SUB-AGENT', rows: [
              ['agents', '[coder, web-search, fetch]'],
              ['max_cost_usd', '0.50  ≤ parent'],
              ['max_steps', '10  ≤ parent'],
              ['exp', 'iat + 60s  ≤ parent'],
              ['run_id', 'r_grandchild…'],
              ['hmac', 'b7e0…'],
            ] } },
          { id: 'log', type: 'text', category: 'layer', x: 120, y: 730,
            text: 'signed log row\nSHA-256(prev_hash ‖ row) · signed',
            customData: { kicker: 'LAYER 5 · SIGNED BY THE MOTHERSHIP', rows: [
              ['prev_hash', 'e91d…'],
              ['org_id · user_id', 'org_acme · alice'],
              ['run_id', 'r_grandchild…'],
              ['agent', 'fetch'],
              ['model · cost', 'claude-sonnet-5 · $0.42'],
              ['macaroon_hash', 'sha256 · 4c8a…'],
              ['sig', 'ed25519 · mothership key'],
            ] } },
          { id: 'providers', type: 'text', category: 'external', x: -405, y: 900,
            text: 'Providers\nAnthropic · OpenAI · Gemini · xAI',
            customData: { kicker: 'REAL KEYS LIVE ONLY HERE' } },
        ],
        edges: [
          { id: 'e-org-ua',     fromNode: 'org',        toNode: 'ua',         label: 'signs · quorum of org keys' },
          { id: 'e-ua-inv',     fromNode: 'ua',         toNode: 'inv',        label: 'user_pubkey binds the next layer' },
          { id: 'e-human-inv',  fromNode: 'human',      toNode: 'inv',        label: 'signs · one per run' },
          { id: 'e-inv-att1',   fromNode: 'inv',        toNode: 'att1',       label: 'user_sig bytes key the HMAC chain' },
          { id: 'e-agent-att1', fromNode: 'agent',      toNode: 'att1',       label: 'attenuates locally · no issuer call' },
          { id: 'e-att1-att2',  fromNode: 'att1',       toNode: 'att2',       label: 'prev hmac keys the next link' },
          { id: 'e-sub-att2',   fromNode: 'subagent',   toNode: 'att2',       label: 'narrows · can never widen' },
          { id: 'e-att2-ms',    fromNode: 'att2',       toNode: 'mothership', label: 'macaroon on every LLM call' },
          { id: 'e-ms-log',     fromNode: 'mothership', toNode: 'log',        label: 'appends · hash-linked · signed' },
          { id: 'e-ms-prov',    fromNode: 'mothership', toNode: 'providers',  label: 'real provider key · proxy key swapped at the edge' },
        ],
      };

      const canvases = {
        mothership: {
          theme,
          nodes: [
            { id: 'ingress',  type: 'text', category: 'component', x: 0,    y: 0,    text: 'ingress\nsplits key from macaroon' },
            { id: 'lookup',   type: 'text', category: 'component', x: 360,  y: 0,    text: 'proxy key lookup\nresolves key → human' },
            { id: 'trust',    type: 'text', category: 'store',     x: 720,  y: -170, text: 'trust registry\norg pubkeys · key rotation' },
            { id: 'verify',   type: 'text', category: 'component', x: 720,  y: 0,    text: 'verifier\norg_sig → user_sig → hmac[]' },
            { id: 'state',    type: 'text', category: 'store',     x: 720,  y: 170,  text: 'hot state\nbudget · kill · revocation' },
            { id: 'quorum',   type: 'text', category: 'store',     x: 1080, y: -170, text: 'approval quorum\nm-of-n humans' },
            { id: 'swap',     type: 'text', category: 'component', x: 1080, y: 0,    text: 'key swap\nproxy key → real key' },
            { id: 'ledger',   type: 'text', category: 'component', x: 1080, y: 170,  text: 'signed log\nSHA-256(prev ‖ row) · signed' },
            { id: 'upstream', type: 'text', category: 'external',  x: 1440, y: -4,   text: 'Providers\nAnthropic · OpenAI · Gemini · xAI', customData: { kicker: 'UPSTREAM' } },
          ],
          edges: [
            { id: 'm1', fromNode: 'ingress', toNode: 'lookup',   label: 'macaroon out' },
            { id: 'm2', fromNode: 'lookup',  toNode: 'verify',   label: 'every call' },
            { id: 'm3', fromNode: 'trust',   toNode: 'verify',   label: 'org policy' },
            { id: 'm4', fromNode: 'verify',  toNode: 'state',    label: 'caps · kill · revoke' },
            { id: 'm5', fromNode: 'verify',  toNode: 'swap',     label: 'user == key owner' },
            { id: 'm6', fromNode: 'quorum',  toNode: 'swap',     label: 'gates big calls' },
            { id: 'm7', fromNode: 'swap',    toNode: 'upstream', label: 'real key' },
            { id: 'm8', fromNode: 'swap',    toNode: 'ledger',   label: 'cost' },
            { id: 'm9', fromNode: 'state',   toNode: 'ledger',   label: 'accumulators' },
          ],
        },
      };

      SystemCanvas.render(document.getElementById('app'), {
        canvas,
        canvases,
        theme: { ...SystemCanvas.themes.midnight, categories: { ...SystemCanvas.themes.midnight.categories, ...categories } },
        edgeStyle: 'bezier',
        rootLabel: 'Delegation chain',
      });
    </script>
  </body>
</html>
