name: gaia-evolve-gen
# ONE GENERATION of the gaia evolution loop: author a candidate → run it
# over the task set → digest the scores. The outer loop (eval/evolve-loop,
# invoked by gaia-evolve) runs this workflow repeatedly, composing each
# generation's `briefing` from the baseline digest + every previous
# attempt's result, so successive authors hill-climb instead of starting
# blind (EVOLVE_SPEC §5.2's reflect beat, §5.3.3's loop-over-versions —
# the gaia instance, mirroring harvey-evolve-gen).
#
# The author is the standard meta/* authoring agent (§5.3.2 grants: meta/*
# and the editor tool, never bash, never graders). It sees correct/wrong
# verdicts and the candidate's own answers only — never the gold — and
# cannot grade its own candidate; grading happens here, after it finishes.
#
# Input:  { tasks, mission, candidateName, generation, briefing }
#   tasks:    GAIA taskIds (the TRAIN set)
#   briefing: composed by eval/evolve-loop — baseline digest, previous
#             attempts (version, accuracy, approach, misses), best-so-far
#             anchor, and the exploit-or-explore directive.
# Output: { candidate, generation, version, summary, changes,
#           missingSecrets, authorCost, authorSteps, digest }
#   digest: the gaia/digest-results object for this generation's candidate
#           runs (fitness = accuracy is what the loop climbs).
steps:
  - id: dir
    type: artifacts/dir
    config:
      sub: author

  # The candidate's active version BEFORE this generation's author runs.
  # If the author publishes nothing, the version fallback below resolves to
  # this very version — a silent re-run of a version already graded (see the
  # `published` gate). Must complete before the author can publish, hence
  # the explicit ordering edge into `author`.
  - id: vbefore
    type: meta/get-workflow
    config:
      name: "{{ input.candidateName }}"

  # ── propose: the authoring agent ───────────────────────────────────────
  - id: author
    type: agent
    depends: [dir, vbefore]
    options:
      retry: { max: 1, delayMs: 15000 }
    config:
      cwd: "{{ dir.path }}"
      system: "{{ params.authorSystem }}"
      prompt: |
        MISSION:
        {{ input.mission }}

        TASK SET ({{ input.tasks.length }} GAIA benchmark task(s)):
        {{ input.tasks }}

        This is GENERATION {{ input.generation }} of an evolution run.

        {{ input.briefing }}

        Author an improved CANDIDATE produce workflow named EXACTLY
        "{{ input.candidateName }}", following the DIRECTIVE above. Address
        miss patterns that RECUR across tasks (never one task's specifics).
        Keep the hard contract, publish, smoke-test on ONE task from the
        task set, and return the result.
        {{ params.authorGuidance }}
      model: "{{ params.authorModel }}"
      maxSteps: "{{ params.authorMaxSteps }}"
      # No bash, no web_search, no file browsing — the author's ONLY levers
      # are the meta/* authoring steps (§5.3.2). The editor tool is kept so
      # it can draft YAML in its (empty) scratch dir before publishing.
      toolFilter: ["str_replace_based_edit_tool"]
      agentTools: ["meta/*"]
      schema:
        type: object
        properties:
          candidate:
            type: string
            description: "the published candidate workflow name"
          version:
            type: string
            description: "EXACT version string of the final healthy publish (from meta/publish-workflow)"
          summary:
            type: string
            description: "the APPROACH this generation took and why — tied to the directive and the recurring miss patterns; the next generation reads this to know what has been tried"
          changes:
            type: array
            items: { type: string }
            description: "one line per concrete change"
          missingSecrets:
            type: array
            description: "credentials the candidate needs that meta/list-secrets does not show — the capture artifact a human fulfills"
            items:
              type: object
              properties:
                name: { type: string }
                why: { type: string }
              required: [name, why]
              additionalProperties: false
        required: [candidate, version, summary]
        additionalProperties: false

  # ── resolve: never trust the author's echo ─────────────────────────────
  # The candidate NAME is harness-pinned (input.candidateName) — grading the
  # string the author returned once zeroed two generations on a literal
  # "placeholder" (in schema mode, one no-tool-call text turn ends the agent
  # loop and IS the structured output). The VERSION falls back to the
  # candidate's active version — the author's own last publish, since
  # generations run sequentially — when the echoed pin is empty or bogus.
  # meta/get-workflow returns { error } instead of throwing, so `vpin.version`
  # is undefined on a bad pin and the `||` falls through to the active one.
  - id: vactive
    type: meta/get-workflow
    depends: author
    config:
      name: "{{ input.candidateName }}"

  - id: vpin
    type: meta/get-workflow
    depends: author
    config:
      name: "{{ input.candidateName }}"
      version: "{{ author.object.version }}"

  # ── evaluate: the pinned candidate over the task set ───────────────────
  # ── did this generation actually SHIP anything? ────────────────────────
  # An author can burn its whole budget and publish NOTHING — observed live
  # when the agent degenerated into a filler loop and echoed a garbage
  # version string. The fallback above then resolves to the candidate's
  # active version, which is the PREVIOUS generation's publish: the harness
  # would re-run an already-graded version over the whole task set, costing
  # a full generation's produce budget to learn nothing. Worse, exact-match
  # scoring resamples — the re-run can land above its own recorded fitness
  # by luck alone and be written into the hill-climb as an improvement.
  #
  # Gate on it instead: same version in as out ⇒ nothing was published ⇒
  # skip `candeval` entirely and report a no-op generation. At generation 0
  # the candidate does not exist yet, so `vbefore.version` is undefined and
  # any real publish trips the gate true.
  - id: published
    type: if
    depends: [vpin, vactive, vbefore]
    config:
      cond: "{{ (vpin.version || vactive.version) && (vpin.version || vactive.version) !== vbefore.version }}"

  - id: candeval
    type: foreach
    depends: published
    when: true
    config:
      items: "{{ input.tasks }}"
      body:
        id: one
        type: subflow
        config:
          workflow: gaia-candidate-run
          input:
            workflow: "{{ input.candidateName }}"
            version: "{{ vpin.version || vactive.version }}"
            taskId: "{{ $current }}"

  - id: canddigest
    type: gaia/digest-results
    depends: candeval
    config:
      results: "{{ candeval }}"

  # Depends on the GATE as well as the digest so it runs on both branches:
  # vein only skip-propagates when EVERY dep was skipped, and `published`
  # always runs. On the no-op branch `canddigest` is skipped, so `digest` is
  # undefined and `noop` tells the loop to score nothing.
  - id: result
    type: gaia/pack-result
    depends: [canddigest, published]
    config:
      candidate: "{{ input.candidateName }}"
      generation: "{{ input.generation }}"
      # True when this generation's author published NOTHING — the loop must
      # record it as a no-op, not as a fitness datapoint (a skipped candeval
      # digests to nothing, which would otherwise read as fitness 0).
      noop: "{{ !published }}"
      # The version that was actually GRADED (resolved above) — the loop's
      # briefing and EXPLOIT anchor read this, so an author's garbage echo
      # must not poison the lineage. Undefined-safe on the no-op branch,
      # where nothing was graded at all.
      version: "{{ vpin.version || vactive.version }}"
      summary: "{{ author.object.summary }}"
      changes: "{{ author.object.changes }}"
      missingSecrets: "{{ author.object.missingSecrets }}"
      authorCost: "{{ author.cost }}"
      authorSteps: "{{ author.steps }}"
      digest: "{{ canddigest }}"

params:
  authorModel: claude-sonnet-5
  # Generous — an author that reads several workflows, drafts steps, and
  # smoke-tests burns calls fast; the publish-early rule in authorSystem is
  # what protects a generation whose budget runs out anyway.
  authorMaxSteps: 200
  # Extra per-run steering appended to the author's task prompt (experiment
  # surface).
  authorGuidance: ""
  # The author's persona + method — layer-1 tunable like any other prompt.
  authorSystem: |
    You are a WORKFLOW AUTHOR inside a self-evolving eval harness. You
    improve HOW a GAIA benchmark answer gets produced by authoring a new
    version of a produce workflow. You never answer benchmark questions
    yourself, and you never see the gold answers — only correct/wrong
    verdicts plus the candidate's own (wrong) answers.

    You are ONE GENERATION in a hill-climbing loop: earlier generations'
    attempts and results are in your task prompt, and your published version
    and summary will be handed to the next generation. Follow the DIRECTIVE
    in the briefing — build on the best attempt when told to exploit, and
    genuinely change strategy when told to explore. The fitness is exact-
    match ACCURACY over the task set: every task flip moves it by 1/n, and
    the same workflow re-run can flip tasks by sampling luck alone — chase
    recurring MISS PATTERNS, never one task's noise.

    WHAT MOVES GAIA SCORES, in rough order of leverage:
    1. ANSWER FORMATTING. Grading is quasi-exact string match. A correct
       fact in the wrong FORM (units included when not asked, "two" vs 2,
       thousands separators, list order, singular/plural, extra words) is
       a miss. Look at each wrong answer in the digest: if it is
       substantively right but shaped wrong, the fix is format discipline —
       re-read-the-question rules, a final format-check pass, or a
       separate fresh-eyes formatting step.
    2. PERSISTENCE. An EMPTY answer means the producer crashed or gave up.
       Fixes live in retry/onError plumbing, step budgets (maxSteps), and
       try-a-different-approach prompt rules.
    3. TOOLING. Wrong extractions (garbled PDF, misread spreadsheet,
       unfetched page) need different tool guidance or a different
       extraction path in the prompt.
    4. STRUCTURE. When one agent drifts, split the work: research vs
       answer vs format-check as separate steps.

    Your only levers are the meta/* authoring tools (the workspace surface):
    meta/get-workflow and meta/list-workflows to read existing YAML;
    meta/list-steps, meta/search-steps, meta/get-step to discover step
    types; meta/create-step / meta/edit-step to author new custom steps
    (TypeScript, defineStep, imports from "vein" and node builtins);
    meta/run-step to test ONE step cheaply; meta/publish-workflow to publish
    the candidate; meta/run-workflow to run it; meta/list-runs,
    meta/get-run, meta/search-runs to inspect those runs; meta/list-secrets
    for available credential NAMES.

    METHOD
    1. Read the DIRECTIVE's anchor first: the best-so-far candidate version
       (meta/get-workflow with the exact version) when exploiting, or the
       base produce workflow when nothing has beaten the baseline. Your
       candidate starts from that YAML, changed only where the evidence
       points.
    2. PUBLISH EARLY. Before any deep step-authoring, publish a first
       candidate version (meta/publish-workflow) that is a modest, safe
       improvement on your anchor. The harness grades whatever your FINAL
       answer names: a rough published candidate beats a perfect
       unpublished one, and if you run out of steps with nothing published,
       this generation's budget is wasted. Republishing the same name
       creates a new version — that is how you iterate upward.
    3. BUDGET YOUR CALLS. You have a hard tool-call cap. Reserve the LAST
       ~5 calls for: final meta/publish-workflow, one verification read,
       and your final structured answer. Time-box debugging.
    4. SMOKE-TEST on ONE task from the task set (meta/run-workflow), then
       inspect (meta/get-run, meta/search-runs). You cannot grade
       correctness — the harness grades after you finish. Check STRUCTURE
       only: the run succeeds and the output object carries taskId, a
       non-empty answer string, cost, steps. Fix and republish until
       healthy. Runs cost real money: one task, at most two smoke runs.
    5. Steps you (or a prior generation) already authored may exist —
       check meta/list-steps before creating: edit and reuse them instead
       of re-authoring from scratch. But when the DIRECTIVE says explore,
       reuse must not drag you back into an approach that already failed.

    WORKFLOW DESIGN PATTERNS — vocabulary, not prescription. A candidate
    may be ANY shape that honors the hard contract: compose these, adapt
    them, or invent shapes not listed here. The one structural insight to
    hold on to: an agent reviewing its own draft inside its own context is
    anchored to it — only a SEPARATE agent step with a clean context gets
    an unbiased re-read. A longer prompt cannot buy fresh eyes; structure
    can.
    - fresh-eyes format checker: after the answering agent, a separate
      CHEAP agent step re-reads ONLY the question text + the draft answer
      and emits the corrected bare answer (units, number form, list order,
      extra words). Fits: substantively-right-but-shaped-wrong misses.
    - researcher → answerer: a research agent gathers evidence into a
      memo; the answering agent consumes the memo and the question. Fits:
      wrong facts from shallow searching.
    - verify-with-code: prompt rules (or a dedicated step) forcing a
      python-via-bash computation for counting/logic/date questions.
      Fits: arithmetic and bookkeeping slips.
    - dual attempt + reconcile: two independent produce attempts and a
      reconciler that picks (or re-derives) the answer when they disagree.
      Expensive — buy it only if the digest shows sampling flips.
    Every added step costs real money — buy structure only where the
    digest shows a recurring miss it answers.

    HARD CONTRACT for the candidate (the harness runs it as-is):
    - input { taskId }.
    - use the gaia/get-task step (plumbing; the gold is stripped) to fetch
      the question/level and stage the task's attached file into the run's
      artifacts dir; give agent steps that dir as cwd via artifacts/dir,
      exactly as the base workflow does.
    - the LAST step (use gaia/pack-result) must output: taskId, question,
      level, answer (the BARE final-answer string), cost, steps.
    - NEVER use gaia/evaluate anywhere in the candidate — self-grading at
      produce time is oracle access, and a candidate that embeds the
      grader is disqualified at promotion review. NEVER grant gaia/*,
      eval/*, or meta/* to any agent step's agentTools — graders and the
      authoring surface are off-limits to producers. Steps you author
      yourself and other registry namespaces are fair game.
    - keep prompts in params (the tuning surface), keep the produce agent's
      retry + onError empty-answer fallback so one bad task cannot kill a
      batch.
    - secrets: reference NAMES from meta/list-secrets only; never paste
      credential values. If a credential you need does not exist, record
      it in the missingSecrets output and make the candidate degrade
      gracefully without it.

    When done, return: the candidate name, the EXACT version string of the
    final healthy publish, a summary of the APPROACH this generation took
    (the next generation reads it to know what has been tried), the list of
    changes, and any missing secrets.

    Your structured answer is harvested from your FINAL message — the turn
    where you stop calling tools. Fill every field with REAL values then:
    never filler like "placeholder" or an empty summary. That summary is
    the only record of this generation's approach the next generation and
    the human report ever see; a generation whose approach is unreadable
    gets retried by later generations, wasting their budget. If you run
    out of steps, still describe truthfully whatever you actually shipped.
