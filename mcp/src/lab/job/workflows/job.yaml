name: job
# Jobs V1 (strut plans/jobs.md): a host launches this with `job` on the
# launch and a prompt; the agent works in the job's directory with a thread
# that remembers every earlier turn, writes its deliverables as files there,
# and the run's output names them. params.tools grants registry steps on
# top of the agent's built-in tools (files, bash, web_search, web_fetch):
# graph reads, the meta/* READ + RUN tools so a turn can run another
# workflow, and the pod/* tools — hive sandboxes, for a change that must run
# to be judged. WHICH workflow or way does which kind of work is graph data,
# never prompt text: the agent opens the `Job` Concept first and follows the
# kind's page (`Code Change` names `code-change-pr` and its child `Pod` says
# when a sandbox is warranted, `Plan Mode` says how to plan); publishing and
# authoring are later lines. `workspace` is the hive workspace this strut
# belongs to, by its slug: the host passes it beside the prompt and the
# message the agent gets starts with it. Every OTHER workspace of the org is
# a peer strut, named by its slug (`@<slug>` in a message) and reached with
# strut/run-workflow — that workspace's graph and repositories, explored
# there; a pod is claimed for whichever workspace's code is changing.
# `session` is the
# agent's thread: the job id unless the launch names one, so every turn of
# a job continues one thread by default, and a host that wants a fresh
# thread over the same files — or a second thread beside the first — passes
# its own id. The directory and the thread are two stores that only this
# line keys alike (strut plans/jobs.md §2); strut never ties them.
# `repos` is the generic way a repository reaches the agent's directory
# (plans/jobs.md §2 as written): each is checked out INTO it, kept there
# turn to turn under the job, a fresh copy in a one-shot's own directory.
input:
  prompt: { type: string, description: "What to do this turn" }
  workspace: { type: string, required: false, description: "The hive workspace this strut belongs to, by its slug. Another workspace of the org is a peer, @<slug>" }
  session: { type: string, required: false, description: "The agent's thread (a session id). Defaults to the job id — one thread across every turn of the job. Pass one to work on the job's files with a different thread (a fresh one, or a second beside the first)" }
  repos: { type: json, required: false, description: "Repository URLs to check out into the job's directory, one subdirectory each, kept there turn to turn (a private one needs the launching person's GITHUB_TOKEN here)" }
steps:
  - id: dir
    type: job/dir
  # One checkout per repository, INTO the job's directory (`workdir: "{{ $job }}"`;
  # a fresh copy in the run's own directory without a job). `|| 0` — foreach
  # takes a count — is "no repositories".
  - id: checkouts
    type: foreach
    config:
      items: "{{ input.repos || 0 }}"
      body:
        id: checkout
        type: git/checkout
        config:
          repo: "{{ $current }}"
          workdir: "{{ $job }}"
  - id: work
    type: agent
    config:
      cwd: "{{ dir.path }}"
      session: "{{ input.session || $job }}"
      cacheTtl: 1h
      model: "{{ params.model }}"
      maxSteps: "{{ params.maxSteps }}"
      system: "{{ params.system }}"
      prompt: "{{ input.workspace ? 'Hive workspace: @' + input.workspace + ', the one this strut belongs to. ' : '' }}{{ checkouts.length ? 'Repositories checked out in your directory, one subdirectory each: ' + checkouts.map(c => c.repo).join(', ') + '. ' : '' }}{{ input.prompt }}"
      agentTools: "{{ params.tools }}"
      schema:
        type: object
        additionalProperties: false
        required: [text, artifacts]
        properties:
          text: { type: string, description: "Your reply to the person, markdown. Short: the artifacts carry the substance." }
          artifacts:
            type: array
            description: "What you produced or revised THIS turn, for the person to look at. Files are paths relative to your working directory."
            items:
              type: object
              additionalProperties: false
              required: [id, title]
              properties:
                id: { type: string, description: "Stable across turns: the same id next turn means a newer version of the same thing (\"plan\", not \"plan-v3\")." }
                kind: { type: string, description: "Only when the file extension would mislead: markdown | html | image | video | audio | pdf | url | diff | pull_request | code | log | json" }
                title: { type: string }
                label: { type: string, description: "What it is to the reader: Plan, Page, Screenshot" }
                summary: { type: string, description: "One sentence about what is in it" }
                path: { type: string, description: "A file you wrote, relative to the working directory" }
                url: { type: string, description: "Somewhere to go instead of a file (absolute)" }
                content: { type: string, description: "Small inline content instead of a file (a diff, short JSON)" }
          ask:
            type: object
            description: "Only when you need a decision from the person before going on: the question, in prose. The answer comes as the next turn's prompt."
            additionalProperties: false
            required: [message]
            properties:
              message: { type: string }
  - id: result
    type: pack
    config:
      text: "{{ work.object.text }}"
      artifacts: "{{ work.object.artifacts }}"
      ask: "{{ work.object.ask }}"
      cost: "{{ work.cost }}"
      session: "{{ work.session }}"
params:
  model: claude-sonnet-5-5
  maxSteps: 500
  # THE evolvable surface: registry steps granted to the agent as tools
  # (agentTools), on top of its built-ins — repo_overview, fulltext_search,
  # bash, str_replace_based_edit_tool, web_search, web_fetch — which are
  # always on. Graph reads (the Concept tree), then the meta/* read + run
  # tools: list/get a workflow, run it (as a child run under this job, in
  # this job's directory — strut plans/jobs.md §4), read a run;
  # strut/run-workflow, the same on a PEER — another workspace's strut, by
  # its slug (strut plans/federation.md §2.2; its files stay there); the pod/*
  # tools (hive sandboxes: claim, reset, the agent in the pod, diff, push,
  # test, release — the `Pod` page under `Code Change` says when and how;
  # a claimed pod is a hold on the job, released with it); the job/* reads
  # (strut plans/job-index.md §5): earlier jobs by words, what one
  # produced and the thread it ran on, one of its files — a screenshot the
  # agent then SEES. Held back until running works: meta/publish-workflow,
  # meta/create-step, the claim tools; browser/* (plans/jobs.md §11).
  tools:
    - graph/graph-search
    - graph/graph-get
    - graph/graph-neighbors
    - graph/get-ontology
    - meta/list-workflows
    - meta/get-workflow
    - meta/run-workflow
    - meta/get-run
    - strut/run-workflow
    - job/list
    - job/get
    - job/read
    - pod/*
  system: |
    You are working on a JOB with a person, over many turns. Your working
    directory is the job's: everything you wrote in earlier turns is still
    there, and you remember writing it. Each turn you get one message. A
    repository named on the launch is checked out in your directory as a
    subdirectory, and stays there turn to turn: read it there.

    Your deliverables are FILES in the working directory — a page as
    index.html, notes as notes/<topic>.md. Revise a file
    in place rather than writing a new one; name files stably. When you are
    done, answer with `text` (short — what changed and why) and `artifacts`
    listing what you produced or revised THIS turn, each with the same `id`
    it had last time. Do not paste a deliverable's content into `text`.

    If you cannot go on without a decision from the person, stop and put
    the question in `ask`; their answer is the next turn's message.

    Before you act on a message, open the `Job` Concept: graph/graph-get
    with node_type "Concept", name "Job", children "PARENT_OF". Its
    children are the kinds of work this workspace has a way to do, each a
    page saying which workflow does it, or how to work. When the request is one
    of these kinds, open that page the same way, by its name, and follow
    it: prefer running the workflow it names over doing the work by hand,
    and say in `text` which page you followed. When no kind fits, the work
    is yours — a plan, a page, notes — as files in your directory.

    Work done before is findable. When a message refers to earlier work —
    a plan, a page, a screenshot, "what we did last week" — look before
    starting over: job/list { q } finds jobs by words (a job's title, or
    what it delivered); job/get shows one — its runs, its files, its
    current deliverables (each with a `path`), its threads; job/read opens
    one of its files (an image, you then see). Say in `text` which job you
    built on.

    Running a workflow: meta/get-workflow shows its input and output;
    meta/run-workflow runs it as its own run under this job (same job id,
    same directory) and returns its output; meta/get-run explains a
    failure; meta/list-workflows lists every workflow when no page names
    one. strut/run-workflow runs one on a PEER — the strut of another
    workspace in this org, named by its slug (`@<slug>` in a message) —
    and returns its output; its files stay there.
