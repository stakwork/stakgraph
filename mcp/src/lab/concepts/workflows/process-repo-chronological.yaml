name: process-repo-chronological
# Walk a repo's PRs + commits oldest-first, classifying each into concepts.
# This is the default (chronological) orchestration. Swap `prioritize`'s
# strategy — or fork this workflow — to experiment with different orderings.
# The decision prompt lives in the `process-change` subflow's own `params`.
#
# Input: { owner, repo, repoPath?, strategy? }
#
# No token in the input (it would be written to the run log): the steps that
# reach GitHub read the run's `GITHUB_TOKEN` secret — the actor's, else the
# deployment's.
steps:
  - id: checkpoint
    type: concepts/resolve-checkpoint
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"

  - id: fetch
    type: concepts/fetch-changes
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"
      checkpoint: "{{ checkpoint.checkpoint }}"

  - id: prioritize
    type: concepts/prioritize-changes
    config:
      changes: "{{ fetch.changes }}"
      strategy: "{{ input.strategy }}"

  - id: process
    type: foreach
    config:
      items: "{{ prioritize.changes }}"
      body:
        id: change
        type: subflow
        config:
          workflow: process-change
          input:
            change: "{{ $current }}"
            owner: "{{ input.owner }}"
            repo: "{{ input.repo }}"
            repoPath: "{{ input.repoPath }}"

  - id: collect
    type: concepts/collect-results
    config:
      results: "{{ process }}"

  - id: summarize
    type: concepts/summarize
    config:
      conceptIds: "{{ collect.modifiedConceptIds }}"

  # The pages ABOVE the features (strut's plans/concept-tree.md): this
  # repository's own page under the `Products` root, every feature parented
  # under it. A page is rewritten only when what it is made from changed —
  # the doc files at HEAD and the features' names and descriptions; the
  # root, its children's pages — told by the hash stamped on it, so most
  # sweeps write nothing here. The prompts are params below.
  - id: pages
    type: concepts/pages
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"
      docFiles: "{{ params.docFiles }}"
      repoPageSystem: "{{ params.repoPageSystem }}"
      productsSystem: "{{ params.productsSystem }}"

  # The sweep's spend (every change's decision, then the summaries, then the
  # pages), onto the repo's running total — `cumulativeUsage` on GET
  # /gitree/concepts.
  - id: record
    type: concepts/record-usage
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"
      usage: ["{{ collect.usage }}", "{{ summarize.usage }}", "{{ pages.usage }}"]

  - id: link
    type: concepts/link-files
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"

# ── params: the pages above the features (the experiment surface) ───────────
# `docFiles`: what a repository's page is distilled from, at HEAD, in order.
# The two prompts answer with one `Description:` line (the page's one-liner,
# what the root's list and the orchestrator read) and then the page.
params:
  docFiles: [README.md, AGENTS.md, CLAUDE.md]
  repoPageSystem: |-
    You write the page a workspace's agents read before they touch a repository. You are given the repository's own docs (its README, AGENTS.md, CLAUDE.md — whichever it has) and the list of its features as the knowledge graph has them.

    Write for an agent that is about to work in it: what the repository is and is for, how it is run and tested, the shape of the code it must know, the conventions that matter, and where the full docs are (the files by path). Distill; never copy. Never list the features: they are listed beside the page. Markdown, at most 6000 characters, no preamble.

    Answer with one line `Description: <one line on what the repository is>`, then a blank line, then the page.
  productsSystem: |-
    You write the overview a workspace's assistant reads to place a request: what this team builds. You are given one page per repository.

    Say what the product is, how the repositories relate — which is the product, which the infrastructure, which serves which — and which repository a kind of request is about, in the words a person would use for it. Never list the repositories: they are listed beside the page. Markdown, at most 6000 characters, no preamble.

    Answer with one line `Description: <one line on what the team builds>`, then a blank line, then the page.
