name: process-repo-chronological
# Walk a repo's PRs + commits oldest-first, classifying each into concepts.
# This is the default (chronological) orchestration. Swap `prioritize`'s
# strategy — or fork this workflow — to experiment with different orderings.
# The decision prompt lives in the `process-change` subflow's own `params`.
#
# Input: { owner, repo, repoPath?, strategy? }
#
# No token in the input (it would be written to the run log): the steps that
# reach GitHub read the run's `GITHUB_TOKEN` secret — the actor's, else the
# deployment's.
steps:
  - id: checkpoint
    type: concepts/resolve-checkpoint
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"

  - id: fetch
    type: concepts/fetch-changes
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"
      checkpoint: "{{ checkpoint.checkpoint }}"

  - id: prioritize
    type: concepts/prioritize-changes
    config:
      changes: "{{ fetch.changes }}"
      strategy: "{{ input.strategy }}"

  - id: process
    type: foreach
    config:
      items: "{{ prioritize.changes }}"
      body:
        id: change
        type: subflow
        config:
          workflow: process-change
          input:
            change: "{{ $current }}"
            owner: "{{ input.owner }}"
            repo: "{{ input.repo }}"
            repoPath: "{{ input.repoPath }}"

  - id: collect
    type: concepts/collect-results
    config:
      results: "{{ process }}"

  - id: summarize
    type: concepts/summarize
    config:
      conceptIds: "{{ collect.modifiedConceptIds }}"

  # The sweep's spend (every change's decision, then the summaries), onto the
  # repo's running total — `cumulativeUsage` on GET /gitree/concepts.
  - id: record
    type: concepts/record-usage
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"
      usage: ["{{ collect.usage }}", "{{ summarize.usage }}"]

  - id: link
    type: concepts/link-files
    config:
      owner: "{{ input.owner }}"
      repo: "{{ input.repo }}"
