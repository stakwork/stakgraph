name: describe-code
# Write a short `description` on every code node (Class, Endpoint, Request,
# Function, Datamodel, Page, Trait, Var) that has a body and none yet — what
# mcp's POST /repo/describe did. One `llm` call per node, inside the one
# step, so a run of thousands of nodes stays one event in the log.
#
# Nothing here embeds. Each code type's Schema `index` includes
# `description`, and strut's embedding pass re-embeds a node into
# `text_embeddings` once its search text changes, so a description is
# searchable by graph/graph-search after the pass's next sweep.
#
# Input:  { repo_url?, file_paths?, cost_limit? }
# Output: { processed, failed, cost, stopped }
input:
  repo_url: { type: string, required: false, description: "GitHub URLs, comma-separated (https://github.com/owner/repo); every repo when omitted" }
  file_paths: { type: json, default: [], description: "file path suffixes to limit it to; every file when empty" }
  cost_limit: { type: number, default: 0.5, description: "dollars; no new call starts once this much is spent" }
params:
  # Any aieo model name the deployment can call (see GET /llm/models). The
  # default is one every deployment can: mcp's /repo/describe proxy passes
  # the cheaper openrouter/qwen/qwen3-coder-30b-a3b-instruct when the
  # deployment has an OpenRouter key, as the old handler did.
  model: haiku
  batch_size: 50
  concurrency: 5
  # {type}, {name}, {docs} and {code} are filled in per node.
  prompt: |-
    Please write a short, concise description (1-3 sentences) for this {type}.
    Do not include the code itself in the description, just describe what it does.

    Name: {name}
    Docs: {docs}

    Code:
    {code}
steps:
  - id: describe
    type: concepts/describe-code
    config:
      repoUrl: "{{ input.repo_url }}"
      filePaths: "{{ input.file_paths }}"
      costLimit: "{{ input.cost_limit }}"
      model: "{{ params.model }}"
      prompt: "{{ params.prompt }}"
      batchSize: "{{ params.batch_size }}"
      concurrency: "{{ params.concurrency }}"
