name: Build and Publish Gateway Docker Image

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ghcr.io/stakwork/stakgraph-gateway

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=registry,ref=ghcr.io/stakwork/stakgraph-gateway:buildcache
          cache-to: type=registry,ref=ghcr.io/stakwork/stakgraph-gateway:buildcache,mode=max
          provenance: false
          sbom: false
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: |
            ghcr.io/stakwork/stakgraph-gateway:${{ github.ref_name }}
            ghcr.io/stakwork/stakgraph-gateway:latest

      # Verify with: gh attestation verify oci://ghcr.io/stakwork/stakgraph-gateway@sha256:<digest> --owner stakwork
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/stakwork/stakgraph-gateway
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
