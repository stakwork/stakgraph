name: Stakgraph Unit Test
# Only `cargo test -p ast --lib`: ast and the crates it pulls in (lsp, shared).
on:
  pull_request:
    branches:
      - main
    paths:
      - "ast/**"
      - "lsp/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-test.yml"

jobs:
  run-test:
    runs-on: ubuntu-latest
    name: Run unit tests
    steps:
      # -------------------- Docker Host --------------------
      - name: Enable docker.host.internal for Ubuntu
        run: |
          pwd && sudo bash -c 'echo "172.17.0.1 host.docker.internal" >> /etc/hosts'

      # -------------------- Checkout --------------------
      - name: Checkout from Github
        uses: actions/checkout@v4

      # -------------------- Rust (basic test) --------------------
      - name: Run rust library tests
        run: cargo test -p ast --lib
